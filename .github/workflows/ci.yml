name: CI

# Constitution V: every change runs lint, types and all tests. `main` is protected so a change with
# failing checks cannot be merged (see README).
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: Start Supabase
        run: pnpm exec supabase start -x studio,realtime,edge-runtime,logflare,vector,supavisor,imgproxy

      - name: Reset database (migrations + seed)
        run: pnpm exec supabase db reset

      - name: Export Supabase environment
        run: |
          pnpm exec supabase status -o env > supabase.env
          get() { grep "^$1=" supabase.env | head -1 | cut -d= -f2- | tr -d '"'; }
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$(get API_URL)"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(get ANON_KEY)"
            echo "SUPABASE_SERVICE_ROLE_KEY=$(get SERVICE_ROLE_KEY)"
            echo "NEXT_PUBLIC_SITE_URL=http://localhost:3000"
            echo "MAILPIT_URL=http://127.0.0.1:54324"
          } >> "$GITHUB_ENV"
          rm supabase.env

      - name: Database types are up to date
        run: |
          pnpm db:types
          git diff --exit-code -- src/lib/supabase/database.types.ts

      - name: Integration tests (RLS and Storage by role)
        run: pnpm test:integration

      - name: Build
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests (critical flows)
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
